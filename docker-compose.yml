version: "3.9"

services:
  auth:
    image: saas-auth:v1
    container_name: auth-service
    ports:
      - "8001:8001"
    networks:
      - saas-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api:
    image: saas-api:v1
    container_name: api-service
    ports:
      - "8002:8002"
    networks:
      - saas-network
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  saas-network:
    driver: bridge